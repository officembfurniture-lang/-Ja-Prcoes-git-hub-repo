name: Value Engine Sensor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Ignore generated cycle output: it must not trigger another sensor cycle.
      - 'value-engine/cycle.py'
      - 'value-engine/sources.json'
      - 'value-engine/policy.json'
      - 'value-engine/routes.json'
      - '.github/workflows/value-engine-cycle.yml'

permissions:
  contents: write

concurrency:
  group: value-engine-sensor
  cancel-in-progress: false

jobs:
  sense:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[value-engine-cycle]')
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Run deterministic SENSE cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 value-engine/cycle.py
      - name: Validate resulting state
        run: python3 value-engine/validate.py
      - name: Run deterministic regression suite before persistence
        run: python3 -m unittest discover -s value-engine -p 'test_*.py' -v
      - name: Observe portfolio health without mutating state
        run: python3 value-engine/health_report.py
      - name: Select advisory feedback focus
        run: python3 value-engine/feedback.py
      - name: Persist state and observations
        run: |
          # Never stage tests, caches, advisory output or unrelated files.
          state_paths=(value-engine/state.json value-engine/observations.ndjson value-engine/run-ledger.ndjson)
          git add -- "${state_paths[@]}"
          if git diff --cached --quiet; then
            echo 'No persisted sensor state change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base="$(git rev-parse HEAD)"
          git commit -m '[value-engine-cycle] persist sensor result'
          # Retain the same sensor result across retries. Rebase only if remote
          # changed unrelated paths. Never auto-merge conflicting state/ledger.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git fetch origin main
            if ! git diff --quiet "$base" origin/main -- "${state_paths[@]}"; then
              echo "::error::Concurrent sensor state changed on main; abandoning stale write, not overwriting ledger."
              exit 1
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Cannot safely rebase sensor result."
              exit 1
            fi
            base="$(git rev-parse HEAD^)"
          done
          echo "::error::Unable to persist sensor result after bounded retries."
          exit 1
