name: Value Engine Sensor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'value-engine/**'
      - '.github/workflows/value-engine-cycle.yml'

permissions:
  contents: write

concurrency:
  group: value-engine-sensor
  cancel-in-progress: false

jobs:
  sense:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[value-engine-cycle]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run deterministic SENSE cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 value-engine/cycle.py
      - name: Validate resulting state
        run: python3 value-engine/validate.py
      - name: Persist state and observations
        run: |
          if git diff --quiet -- value-engine/; then
            echo 'No VALUE_ENGINE state change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add value-engine/
          git commit -m '[value-engine-cycle] persist sensor result'
          git push
