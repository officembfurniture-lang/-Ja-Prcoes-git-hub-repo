name: Bounty Engine Validate

on:
  pull_request:
    paths:
      - 'bounty-engine/**'
      - '.github/workflows/bounty-engine-validate.yml'
  push:
    branches: [main]
    paths:
      - 'bounty-engine/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate state and ledger invariants
        run: python3 bounty-engine/validate_state.py
