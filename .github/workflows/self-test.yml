name: Validate public probe
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: flex
        uses: ./
        with:
          workload: examples/workload.json
          output: grid-flex-result.json
      - name: Enforce truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("grid-flex-result.json").read_text())
          assert result["moved_task_ids"] == ["batch-evaluation"]
          assert result["truth_boundary"]["physical_savings_claimed"] is False
          PY
      - name: Bootstrap VALUE_ENGINE validation when present
        if: ${{ hashFiles('value-engine/validate.py') != '' }}
        run: |
          python3 value-engine/validate.py
          python3 -m py_compile value-engine/cycle.py value-engine/validate.py
