name: Value Engine Triage Shadow

on:
  push:
    branches:
      - experiment/value-engine-triage-v1
    paths:
      - value-engine/triage.py
      - value-engine/test_triage.py
      - value-engine/observations.ndjson
      - .github/workflows/value-engine-triage-shadow.yml
  pull_request:
    paths:
      - value-engine/triage.py
      - value-engine/test_triage.py
      - .github/workflows/value-engine-triage-shadow.yml
  workflow_run:
    workflows:
      - Value Engine Sensor
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-triage:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Unit tests
        working-directory: value-engine
        run: python3 -m unittest -v test_triage.py
      - name: Replay triage against persisted observations
        working-directory: value-engine
        run: |
          python3 triage.py \
            --observations observations.ndjson \
            --queue /tmp/value-engine-triage-queue.ndjson \
            --summary /tmp/value-engine-triage-summary.json \
            --limit 50 \
            --as-of "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat /tmp/value-engine-triage-summary.json
      - name: Show top semantic VERIFY candidates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          lines = Path('/tmp/value-engine-triage-queue.ndjson').read_text().splitlines()
          for rank, line in enumerate(lines[:20], start=1):
              item = json.loads(line)
              print(json.dumps({
                  'rank': rank,
                  'score': item['triage_score'],
                  'title': item.get('title'),
                  'url': item.get('url'),
                  'amounts': item.get('amount_mentions', []),
                  'reasons': item.get('reasons', []),
                  'risks': item.get('risks', []),
              }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Enforce shadow invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('/tmp/value-engine-triage-summary.json').read_text())
          assert summary['stage'] == 'PRE_VERIFY_TRIAGE'
          assert summary['reference_time_source'] == 'explicit_as_of'
          assert summary['snapshot_max_age_days'] == 7
          assert summary['authoritative'] is False
          assert 0 <= summary['verify_queue_emitted'] <= 50

          queue = Path('/tmp/value-engine-triage-queue.ndjson').read_text().splitlines()
          for line in queue:
              item = json.loads(line)
              assert item['status'] == 'OBSERVED'
              assert item['primary_source_verified'] is False
              assert item['demand_or_reward_verified'] is False
              assert item['realized_value'] == 0
              assert item['disposition'] == 'QUEUE_VERIFY'
          PY
      - name: Bind output to exact input and checkout
        run: |
          git rev-parse HEAD > /tmp/value-engine-triage-checkout-sha.txt
          sha256sum value-engine/observations.ndjson \
            /tmp/value-engine-triage-queue.ndjson \
            /tmp/value-engine-triage-summary.json \
            > /tmp/value-engine-triage-sha256.txt
      - name: Preserve read-only VERIFY queue for semantic worker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: value-engine-pre-verify-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/value-engine-triage-queue.ndjson
            /tmp/value-engine-triage-summary.json
            /tmp/value-engine-triage-sha256.txt
            /tmp/value-engine-triage-checkout-sha.txt
