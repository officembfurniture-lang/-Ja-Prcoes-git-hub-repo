name: Value Engine Triage Shadow

on:
  push:
    branches:
      - experiment/value-engine-triage-v1
    paths:
      - value-engine/triage.py
      - value-engine/test_triage.py
      - value-engine/observations.ndjson
      - .github/workflows/value-engine-triage-shadow.yml
  pull_request:
    paths:
      - value-engine/triage.py
      - value-engine/test_triage.py
      - value-engine/source_probe.py
      - value-engine/test_source_probe.py
      - value-engine/readback_review.py
      - value-engine/test_readback_review.py
      - value-engine/readback_cooldown.py
      - value-engine/test_readback_cooldown.py
      - .github/workflows/value-engine-triage-shadow.yml
  workflow_run:
    workflows:
      - Value Engine Sensor
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shadow-triage:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: sensor-handoff
        name: Resolve triggering sensor's exact persisted state commit
        if: github.event_name == 'workflow_run'
        env:
          TRIGGERING_SENSOR_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 value-engine/sensor_handoff.py \
            --run-id "$TRIGGERING_SENSOR_RUN_ID" \
            --output "$GITHUB_OUTPUT"
      - name: Checkout matching sensor snapshot before reading its observations
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.sensor-handoff.outputs.state_commit }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Validate exact sensor input before running triage
        run: python3 value-engine/validate.py
      - name: Unit tests
        working-directory: value-engine
        run: python3 -m unittest -v test_triage.py
      - name: Source readback regression tests (offline)
        working-directory: value-engine
        run: python3 -m unittest -v test_source_probe.py
      - name: Readback decision regressions (offline)
        working-directory: value-engine
        run: python3 -m unittest -v test_readback_review.py
      - name: Cross-run source cooldown regressions (offline)
        working-directory: value-engine
        run: python3 -m unittest -v test_readback_cooldown.py
      - name: Smoke-test provenance lookup against actual main sensor ledger
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          expected="$(python3 - <<'PY'
          import json
          import subprocess
          state = json.loads(subprocess.check_output(
              ['git', 'show', 'origin/main:value-engine/state.json'], text=True))
          print(state['last_cycle_result']['cycle_id'].rsplit('-', 1)[1])
          PY
          )"
          python3 value-engine/sensor_handoff.py \
            --run-id "$expected" \
            --output /tmp/sensor-handoff-smoke.output
          grep -Eq '^state_commit=[0-9a-f]{40}$' /tmp/sensor-handoff-smoke.output
      - name: Replay triage against persisted observations
        working-directory: value-engine
        run: |
          python3 triage.py \
            --observations observations.ndjson \
            --queue /tmp/value-engine-triage-queue.ndjson \
            --summary /tmp/value-engine-triage-summary.json \
            --limit 0 \
            --as-of "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat /tmp/value-engine-triage-summary.json
      - name: Show top semantic VERIFY candidates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          lines = Path('/tmp/value-engine-triage-queue.ndjson').read_text().splitlines()
          for rank, line in enumerate(lines[:20], start=1):
              item = json.loads(line)
              print(json.dumps({
                  'rank': rank,
                  'score': item['triage_score'],
                  'title': item.get('title'),
                  'url': item.get('url'),
                  'amounts': item.get('amount_mentions', []),
                  'reasons': item.get('reasons', []),
                  'risks': item.get('risks', []),
              }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Read prior successful main triage artifact (read-only, optional)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only a completed, successful main workflow_run can supply prior
          # feedback. A PR artifact or another branch is never trusted.
          prior_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/value-engine-triage-shadow.yml/runs?branch=main&status=success&per_page=30" \
            --jq '[.workflow_runs[] | select(.event == "workflow_run")] | .[0].id // empty' || true)"
          if [[ ! "$prior_run" =~ ^[0-9]+$ ]]; then
            echo "No eligible prior completed main triage run; fresh GET fallback."
          else
            mkdir -p /tmp/value-engine-prior
            if gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" \
                 --name "value-engine-pre-verify-$prior_run" \
                 --dir /tmp/value-engine-prior; then
              echo "PREVIOUS_READBACK_BUNDLE=/tmp/value-engine-prior" >> "$GITHUB_ENV"
              echo "Using optional prior main triage artifact run=$prior_run"
            else
              echo "Prior artifact unavailable; current readback remains enabled."
            fi
          fi
      - name: Bounded source readback of queue candidates (non-authoritative)
        working-directory: value-engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          prior_args=()
          if [ -n "${PREVIOUS_READBACK_BUNDLE:-}" ]; then
            prior_args+=(--prior-bundle "$PREVIOUS_READBACK_BUNDLE")
          fi
          python3 source_probe.py \
            --queue /tmp/value-engine-triage-queue.ndjson \
            --output /tmp/value-engine-source-readback.ndjson \
            --summary /tmp/value-engine-source-readback-summary.json \
            --limit 3 \
            --rotation "${{ github.run_number }}" \
            "${prior_args[@]}"
      - name: Cross-check live source readbacks and produce review decisions
        working-directory: value-engine
        run: |
          python3 readback_review.py \
            --queue /tmp/value-engine-triage-queue.ndjson \
            --readbacks /tmp/value-engine-source-readback.ndjson \
            --probe-summary /tmp/value-engine-source-readback-summary.json \
            --output /tmp/value-engine-readback-decisions.ndjson \
            --summary /tmp/value-engine-readback-review-summary.json
      - name: Enforce shadow invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('/tmp/value-engine-triage-summary.json').read_text())
          assert summary['stage'] == 'PRE_VERIFY_TRIAGE'
          assert summary['reference_time_source'] == 'explicit_as_of'
          assert summary['snapshot_max_age_days'] == 7
          assert summary['authoritative'] is False
          assert summary['complete_verify_queue'] is True
          assert summary['verify_queue_emitted'] == summary['verify_queue_total']
          assert 0 <= summary['verify_queue_emitted'] <= 5000
          assert summary['max_complete_verify_queue'] == 5000

          # A fresh GitHub GET never grants economic or execution authority.
          from hashlib import sha256
          probe = json.loads(Path('/tmp/value-engine-source-readback-summary.json').read_text())
          assert probe['schema'] == 'value-engine.source-readback/v2'
          assert probe['stage'] == 'SOURCE_READBACK_NON_AUTHORITATIVE'
          assert probe['authoritative'] is False
          assert probe['queue_sha256'] == sha256(Path('/tmp/value-engine-triage-queue.ndjson').read_bytes()).hexdigest()
          assert probe['queue_count'] == summary['verify_queue_total']
          assert probe['prior_feedback_status'] in (
              'NOT_CONFIGURED', 'SUPPRESSION_APPLIED',
              'VALID_NO_SUPPRESSION', 'INVALID_FALLBACK_TO_FRESH_GET')
          assert isinstance(probe['recent_readbacks_skipped'], list)
          assert probe['eligible_after_recent_cooldown'] >= 0
          assert probe['eligible_after_recent_cooldown'] + len(probe['recent_readbacks_skipped']) == probe['eligible_unique_urls']
          assert len({x['queue_rank'] for x in probe['recent_readbacks_skipped']}) == len(probe['recent_readbacks_skipped'])
          if probe['prior_feedback_status'] == 'SUPPRESSION_APPLIED':
              assert len(probe['recent_readbacks_skipped']) > 0
          else:
              assert probe['recent_readbacks_skipped'] == []
          assert 0 <= probe['attempted'] <= 3
          assert 0 <= probe['results'] <= 3
          assert probe['rotation'] == ${{ github.run_number }}
          assert isinstance(probe['selected_queue_ranks'], list)
          assert len(probe['selected_queue_ranks']) == probe['results']
          assert len(set(probe['selected_queue_ranks'])) == probe['results']
          assert all(isinstance(rank, int) and rank >= 1 for rank in probe['selected_queue_ranks'])
          for key in ('primary_source_verified', 'demand_or_reward_verified',
                      'settlement_route_verified', 'authorization_to_execute'):
              assert probe[key] is False, key
          assert probe['realized_value'] == 0
          evidence = Path('/tmp/value-engine-source-readback.ndjson').read_text().splitlines()
          assert len(evidence) == probe['results']
          for line in evidence:
              entry = json.loads(line)
              assert entry['status'] in ('READBACK_OPEN', 'READBACK_CLOSED', 'READBACK_FAILED')
              assert entry['primary_source_verified'] is False
              assert entry['demand_or_reward_verified'] is False
              assert entry['settlement_route_verified'] is False
              assert entry['authorization_to_execute'] is False
              assert entry['realized_value'] == 0

          review = json.loads(Path('/tmp/value-engine-readback-review-summary.json').read_text())
          assert review['schema'] == 'value-engine.readback-review/v2'
          assert review['stage'] == 'READBACK_DECISION_PRE_VERIFY'
          assert review['queue_sha256'] == probe['queue_sha256']
          assert review['readbacks_sha256'] == sha256(Path('/tmp/value-engine-source-readback.ndjson').read_bytes()).hexdigest()
          assert review['probe_summary_sha256'] == sha256(Path('/tmp/value-engine-source-readback-summary.json').read_bytes()).hexdigest()
          assert review['queue_count'] == summary['verify_queue_total']
          assert review['readback_count'] == probe['results']
          assert review['not_read_back_count'] == probe['queue_count'] - probe['results']
          assert review['selected_queue_ranks'] == probe['selected_queue_ranks']
          assert review['authoritative'] is False
          for key in ('primary_source_verified', 'demand_or_reward_verified',
                      'settlement_route_verified', 'authorization_to_execute'):
              assert review[key] is False, key
          assert review['realized_value'] == 0
          review_rows = [json.loads(row) for row in
                         Path('/tmp/value-engine-readback-decisions.ndjson').read_text().splitlines()]
          assert len(review_rows) == probe['results']
          assert sum(review['review_decisions'].values()) == probe['results']
          assert all(row['authorization_to_execute'] is False
                     and row['demand_or_reward_verified'] is False
                     and row['realized_value'] == 0 for row in review_rows)

          queue = Path('/tmp/value-engine-triage-queue.ndjson').read_text().splitlines()
          for line in queue:
              item = json.loads(line)
              assert item['status'] == 'OBSERVED'
              assert item['primary_source_verified'] is False
              assert item['demand_or_reward_verified'] is False
              assert item['realized_value'] == 0
              assert item['disposition'] == 'QUEUE_VERIFY'
          PY
      - name: Bind output to exact input and checkout
        run: |
          git rev-parse HEAD > /tmp/value-engine-triage-checkout-sha.txt
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "$(cat /tmp/value-engine-triage-checkout-sha.txt)" = "${{ steps.sensor-handoff.outputs.state_commit }}"
          fi
          sha256sum value-engine/observations.ndjson \
            /tmp/value-engine-triage-queue.ndjson \
            /tmp/value-engine-triage-summary.json \
            /tmp/value-engine-source-readback.ndjson \
            /tmp/value-engine-source-readback-summary.json \
            /tmp/value-engine-readback-decisions.ndjson \
            /tmp/value-engine-readback-review-summary.json \
            > /tmp/value-engine-triage-sha256.txt
      - name: Preserve read-only VERIFY queue for semantic worker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: value-engine-pre-verify-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/value-engine-triage-queue.ndjson
            /tmp/value-engine-triage-summary.json
            /tmp/value-engine-source-readback.ndjson
            /tmp/value-engine-source-readback-summary.json
            /tmp/value-engine-readback-decisions.ndjson
            /tmp/value-engine-readback-review-summary.json
            /tmp/value-engine-triage-sha256.txt
            /tmp/value-engine-triage-checkout-sha.txt
