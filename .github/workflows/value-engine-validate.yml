name: Value Engine Validate

on:
  pull_request:
    paths:
      - 'value-engine/**'
      - '.github/workflows/value-engine-validate.yml'
      - '.github/workflows/value-engine-cycle.yml'
  push:
    branches: [main]
    paths:
      - 'value-engine/**'
      - '.github/workflows/value-engine-validate.yml'
      - '.github/workflows/value-engine-cycle.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate VALUE_ENGINE invariants
        run: python3 value-engine/validate.py
      - name: Test VALUE_ENGINE validation and triage
        run: python3 -m unittest discover -s value-engine -p 'test_*.py' -v
      - name: Syntax-check deterministic sensor
        run: python3 -m compileall -q value-engine
